apiVersion: apps/v1
kind: Deployment
metadata:
  name: get-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: get-depl
  template:
    metadata:
      labels:
        app: get-depl
    spec:
      containers:
        - name: get-depl
          image: sarthakm96/get
---
apiVersion: v1
kind: Service
metadata:
  name: get-srv
spec: 
  type: ClusterIP
  selector:
    app: get-depl
  ports:
    - name: get-srv
      protocol: TCP
      port: 3003
      targetPort: 3003
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
data:
  NODE_ENV: production

  AUTH_SERVICE_URL: http://auth-srv:3005
  CREATE_SERVICE_URL: http://create-srv:3007
  DELETE_SERVICE_URL: http://delete-srv:3008
  UPDATE_SERVICE_URL: http://update-srv:3009
  GET_SERVICE_URL: http://get-srv:3010  
  MONGO_URL: mongodb://mongo:27017/auth
  REDIS_URL: redis://redis:6379  
  KAFKA_URL: kafka:9092