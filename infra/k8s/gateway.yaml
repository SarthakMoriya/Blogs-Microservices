apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-depl
  template:
    metadata:
      labels:
        app: gateway-depl
    spec:
      containers:
        - name: gateway-depl
          image: sarthakm96/apigateway
          envFrom:
           - configMapRef:
              name: gateway-config          
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-srv
spec: 
  type: ClusterIP
  selector:
    app: gateway-depl
  ports:
    - name: gateway-srv
      protocol: TCP
      port: 3006
      targetPort: 3006
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
data:
  NODE_ENV: production

  AUTH_SERVICE_URL: http://auth-srv:3005
  CREATE_SERVICE_URL: http://create-srv:3007
  DELETE_SERVICE_URL: http://delete-srv:3008
  UPDATE_SERVICE_URL: http://update-srv:3009
  GET_SERVICE_URL: http://get-srv:3010  
  MONGO_URL: mongodb://mongo:27017
  REDIS_URL: redis://redis:6379
  KAFKA_URL: kafka:9092