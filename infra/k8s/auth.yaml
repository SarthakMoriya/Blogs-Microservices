# -----------------------------
# Deployment: manages Pods
# -----------------------------
apiVersion: apps/v1                  # API version for Deployment objects
kind: Deployment                     # Object type is Deployment
metadata:
  name: auth-depl                     # Name of the Deployment itself
                                      # Used to identify this Deployment in kubectl commands
spec:
  replicas: 1                         # Desired number of Pods
                                      # Kubernetes will always try to maintain this many Pods
  selector:
    matchLabels:
      app: auth-depl                  # Selector defines how Deployment finds the Pods it manages
                                      # Only Pods with labels matching this are considered "owned" by this Deployment
  template:                           # Pod template: blueprint for creating Pods
    metadata:
      labels:
        app: auth-depl                # Labels applied to Pods created by this Deployment
                                      # Must match the Deployment selector above
                                      # Kubernetes uses these labels to know which Pods belong to this Deployment
    spec:                             
      containers:                     # List of containers inside each Pod
        - name: auth-depl             # Name of the container inside the Pod
          image: sarthakm96/auth     # Docker image to run in the container
                                      # Kubernetes will pull this image and run it inside the Pod

# -----------------------------
# Service: exposes Pods
# -----------------------------
---
apiVersion: v1                        # API version for Service objects
kind: Service                         # Object type is Service
metadata:
  name: auth-srv                      # Name of the Service
                                      # Used to reference this Service in kubectl or from other Pods
spec: 
  type: ClusterIP                     # ClusterIP type Service: accessible only inside the cluster
  selector:
    app: auth-depl                    # Service routes traffic to all Pods with this label
                                      # Matches the labels applied by the Deployment above
  ports:
    - name: auth-srv                  # Name of the port (optional)
      protocol: TCP                   # Protocol used
      port: 3005                      # Port exposed by the Service inside the cluster
      targetPort: 3005                # Port on the Pod/container to forward traffic to
